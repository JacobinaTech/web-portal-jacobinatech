name: CI

# Valida todo PR: lint + build (o build valida o frontmatter de /content).
# O deploy fica nos workflows firebase-hosting-*.yml.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
