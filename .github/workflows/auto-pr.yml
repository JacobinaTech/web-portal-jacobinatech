name: Abrir PR automaticamente

# No primeiro push de uma branch feat/…, fix/…, ci/… ou doc/…, abre um PR para a main.
# O preview fica a cargo do firebase-hosting-pull-request.yml: o PR aberto pelo bot dispara o pull_request,
# mas o GitHub exige "Approve and run workflows" (um clique de um maintainer) na abertura.
# Nos pushes seguintes quem dispara é o autor do push, sem esse clique.
#
# Requer: Settings → Actions → General → Workflow permissions →
#         ✅ "Allow GitHub Actions to create and approve pull requests"
#         (na organização, a mesma opção precisa estar liberada em Organization settings → Actions).
# A aprovação pelo bot NÃO libera merge: o ruleset exige review de Code Owners (time professores).
on:
  push:
    # Só branches no padrão; outros nomes não abrem PR (e o check branch-name do ci.yml bloqueia o merge).
    branches: ["feat/**", "fix/**", "ci/**", "doc/**"]

permissions:
  contents: read

concurrency:
  group: auto-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    # Push que apenas apaga a branch não abre PR.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Abrir PR (se ainda não existir)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing já existe para $BRANCH."
            exit 0
          fi

          # Título = primeiro commit da branch; corpo = lista de commits + checklist.
          title=$(git log --reverse --format=%s origin/main..HEAD | head -1)
          {
            echo "PR aberto automaticamente a partir do push em \`$BRANCH\`."
            echo
            echo "## Commits"
            git log --reverse --format='- %s' origin/main..HEAD
            echo
            echo "## Checklist"
            echo "- [ ] Revisei o preview comentado abaixo"
            echo "- [ ] Tenho autorização para publicar nomes/imagens citados"
          } > body.md

          # Aviso para quem aprova o preview: workflows/configs de deploy alterados nesta branch.
          # (Este arquivo roda na versão da branch; o pr-guard.yml, que roda da main, cobre os pushes seguintes.)
          sensitive=$(git diff --name-only origin/main...HEAD | grep -E '^(\.github/|firebase\.json$|\.firebaserc$)' || true)
          if [ -n "$sensitive" ]; then
            {
              echo
              echo "> [!WARNING]"
              echo "> Este PR altera workflows ou configuração de deploy. **Revise antes de aprovar o preview:**"
              echo "$sensitive" | sed 's/^/> - `/; s/$/`/'
            } >> body.md
          fi

          url=$(gh pr create --base main --head "$BRANCH" --title "${title:-$BRANCH}" --body-file body.md)
          echo "Criado: $url"
