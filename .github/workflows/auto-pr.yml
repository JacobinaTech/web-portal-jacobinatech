name: Abrir PR automaticamente

# No primeiro push de uma branch feat/…, fix/…, ci/… ou doc/…, abre um PR para a main e publica o preview.
# Nos pushes seguintes o PR já existe: CI e preview seguem pelos workflows normais.
#
# Requer: Settings → Actions → General → Workflow permissions →
#         ✅ "Allow GitHub Actions to create and approve pull requests"
#         (na organização, a mesma opção precisa estar liberada em Organization settings → Actions).
on:
  push:
    # Só branches no padrão; outros nomes não abrem PR (e o check branch-name do ci.yml bloqueia o merge).
    branches: ["feat/**", "fix/**", "ci/**", "doc/**"]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: auto-pr-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  open-pr:
    # Push que apenas apaga a branch não abre PR.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
      created: ${{ steps.pr.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "PR #$existing já existe para $BRANCH."
            echo "number=$existing" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Título = primeiro commit da branch; corpo = lista de commits + checklist.
          title=$(git log --reverse --format=%s origin/main..HEAD | head -1)
          {
            echo "PR aberto automaticamente a partir do push em \`$BRANCH\`."
            echo
            echo "## Commits"
            git log --reverse --format='- %s' origin/main..HEAD
            echo
            echo "## Checklist"
            echo "- [ ] Revisei o preview comentado abaixo"
            echo "- [ ] Tenho autorização para publicar nomes/imagens citados"
          } > body.md

          url=$(gh pr create --base main --head "$BRANCH" --title "${title:-$BRANCH}" --body-file body.md)
          number=${url##*/}
          echo "Criado PR #$number: $url"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

  # O evento "PR aberto" acima não dispara o workflow de preview (limitação do GITHUB_TOKEN),
  # então o primeiro preview é publicado e comentado aqui.
  first-preview:
    needs: open-pr
    if: ${{ needs.open-pr.outputs.created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://jacobina.tech
      - id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JACOBINATECH }}
          projectId: jacobinatech
          channelId: pr${{ needs.open-pr.outputs.number }}
          expires: 7d
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.details_url }}
          EXPIRES: ${{ steps.deploy.outputs.expire_time }}
        run: |
          gh pr comment ${{ needs.open-pr.outputs.number }} --repo "$GITHUB_REPOSITORY" \
            --body "🔍 **Preview:** $URL"$'\n\n'"Expira em: $EXPIRES"
