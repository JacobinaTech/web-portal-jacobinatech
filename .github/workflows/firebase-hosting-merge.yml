name: Deploy (Firebase Hosting)

on:
  push:
    branches: [main]
  # Rebuild diário: "próximos x realizados" dos encontros é calculado no build.
  schedule:
    - cron: "0 6 * * *" # 03:00 em Jacobina (UTC−3)
  workflow_dispatch:

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secret de produção só existe no environment "production", restrito à branch main.
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://jacobinatech.web.app # trocar quando houver domínio próprio
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JACOBINATECH }}
          projectId: jacobinatech
          channelId: live
