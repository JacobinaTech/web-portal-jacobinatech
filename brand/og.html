<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>OG — Jacobina.Tech (1200×630)</title>
<style id="base"></style>
<style>
  .card{position:relative;width:1200px;height:630px;overflow:hidden;color:#f7f5ef;font-family:"DM Sans"}
  .serra{position:absolute;left:0;bottom:0;color:rgb(165 180 252/.32)}
  .content{position:absolute;left:72px;top:64px;right:72px;bottom:56px;display:flex;flex-direction:column}
  .logo{display:flex;align-items:center;gap:14px}
  h1{margin-top:auto;font:700 74px/1.02 "Space Grotesk";letter-spacing:-.035em;max-width:700px}
  .bar{width:84px;height:5px;border-radius:9px;background:linear-gradient(90deg,#38bdf8,#a78bfa);margin:30px 0 26px}
  p{font-size:26px;line-height:1.4;color:rgb(247 245 239/.7);max-width:640px}
  .url{margin-top:34px;font:500 20px "JetBrains Mono";color:rgb(247 245 239/.55)}
  .url b{color:#f5b301;font-weight:500}
  .hub{position:absolute;right:92px;top:150px;width:300px;height:300px;border-radius:72px;display:grid;place-items:center;
       background:linear-gradient(135deg,rgb(56 189 248/.18),rgb(139 92 246/.22));
       box-shadow:0 0 140px 20px rgb(129 140 248/.45), inset 0 0 0 2px rgb(125 211 252/.45);backdrop-filter:blur(8px)}
</style>
</head>
<body>
<div class="card">
  <div class="glow"></div>
  <div class="serra" id="serra"></div>
  <div class="hub" id="hub"></div>
  <div class="content">
    <div class="logo" id="logo"></div>
    <h1>Tecnologia que transforma a <span class="grad" style="white-space:nowrap">nossa região</span>.</h1>
    <div class="bar"></div>
    <p>Encontros, projetos e oportunidades em tecnologia no Piemonte da Diamantina.</p>
    <div class="url"><b>&gt;</b> jacobina.tech</div>
  </div>
</div>
<script type="module">
  import { icon, wordmark, serra, baseCss } from "./shared.js";
  document.getElementById("base").textContent = baseCss;
  document.getElementById("serra").innerHTML = serra(1200, 260);
  document.getElementById("hub").innerHTML = icon(190, "hub");
  document.getElementById("logo").innerHTML = icon(54, "logo") + wordmark(36);
</script>
</body>
</html>
